name: Capability validation
on:
  push:
    branches: [validate-bind-capabilities-7435]
permissions:
  contents: read
jobs:
  test-capabilities:
    name: Test Linux capabilities (cgo=${{ matrix.cgo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cgo: ['0', '1']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          repository: houyuwushang/coredns
          ref: d2c1acb9990a07cfccaff569ea16cbc4b145fd95
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: .go-version
      - name: Build capability tests
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p "$RUNNER_TEMP/capabilities"
          go build -o "$RUNNER_TEMP/capabilities/coredns" .
          race=()
          if [ "$CGO_ENABLED" = 1 ]; then race=(-race); fi
          go test "${race[@]}" -c -o "$RUNNER_TEMP/capabilities/reuseport.test" ./plugin/pkg/reuseport
      - name: Test permitted capabilities and thread isolation
        run: |
          sudo setcap cap_net_bind_service=p "$RUNNER_TEMP/capabilities/reuseport.test"
          sudo unshare --net sh -ec '
            ip link set lo up
            sysctl -qw net.ipv4.ip_unprivileged_port_start=1024
            exec setpriv --reuid=65532 --regid=65532 --clear-groups \
              --bounding-set=-all,+net_bind_service --inh-caps=-all --ambient-caps=-all \
              env COREDNS_TEST_BIND_CAPABILITY=1 "$1" -test.v -test.run TestListenWith
          ' sh "$RUNNER_TEMP/capabilities/reuseport.test"
      - name: Test CoreDNS with restricted capabilities
        run: |
          caps=$(sed -n 's/^RUN setcap \(.*\) \/coredns/\1/p' Dockerfile)
          sudo unshare --net python3 .github/test-capabilities.py \
            --binary "$RUNNER_TEMP/capabilities/coredns" --caps "$caps" --label 'cgo=${{ matrix.cgo }}'
      - name: Test container startup with all capabilities dropped
        if: matrix.cgo == '0'
        run: |
          docker build -f Dockerfile -t coredns-capabilities "$RUNNER_TEMP/capabilities"
          docker run --rm --cap-drop=ALL coredns-capabilities -version
          docker run --rm --cap-drop=ALL coredns-capabilities -plugins

